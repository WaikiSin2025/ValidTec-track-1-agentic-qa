name: Track 1 CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install package
        run: pip install -e . --no-build-isolation

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run approved demo
        run: >
          validtec-agentic-qa
          --ticket examples/feature_ticket.json
          --output output/ci-demo
          --approve
