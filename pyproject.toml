[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "validtec-agentic-qa"
version = "0.1.0"
description = "ValidTec Track 1 reference implementation for controlled agentic QA orchestration"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "ValidTec"}]
license = {text = "MIT"}

[project.scripts]
validtec-agentic-qa = "validtec_agentic_qa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
